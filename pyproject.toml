[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "derms-tkg-power-lab"
version = "0.1.0"
requires-python = ">=3.11"
description = "Prototipo DERMS/TKG con QSTS OpenDSS remoto, RDF y optimización"
dependencies = [
  "fastapi>=0.110,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "websockets>=13,<17", "rdflib>=7,<9", "pydantic>=2.6,<3",
  "scipy>=1.12,<2", "tzdata>=2024.1",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24", "ruff>=0.9,<1"]
oxigraph = ["oxrdflib>=0.3.5"]
[tool.setuptools.packages.find]
include = ["backend*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.ruff.lint.isort]
known-first-party = ["backend"]
